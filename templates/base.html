{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Project Management{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block extra_css %}
    
    {% endblock %}
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <div class="sidebar">

        <h4 class="logo">Project Management</h4>

        <a href="{% url 'CreateNewPage' %}" class="create-btn">
            Create New
        </a>

        <ul class="menu">

            <li>
                <a href="{% url 'DSBord' %}">Dashboard</a>
            </li>

            <li>
                <a href="{% url 'project' %}">Project</a>
            </li>

            <li>
                <a href="{% url 'calendarpage' %}">Calendar</a>
            </li>

            <li>
                <a href="{% url 'notification' %}">Notifications</a>
            </li>

            <li>
                <a href="{% url 'profile' %}">My Profile</a>
            </li>

            <li>
                <a href="{% url 'loginpage' %}">Log Out</a>
            </li>

        </ul>

    </div>

    <!-- Page Content -->
    <div class="main">

        {% block content %}
        {% endblock %}

    </div>

</div>

{% block extra_js %}
{% endblock %}

</body>
</html>
