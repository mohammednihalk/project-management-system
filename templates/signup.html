{% load static %}

<html>
<head>

<title>Sign Up</title>

<link rel="stylesheet" href="{% static 'css/signup.css' %}">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

</head>

<body>

<div class="container">

<div class="signup-box">

<h2>Create Account</h2>
{% if messages %}
    {% for message in messages %}
        <p style="color:white; background:red; padding:8px; border-radius:5px;">
    {{ message }}
</p>
    {% endfor %}
{% endif %}

<form method="post" action="{% url 'signup' %}" id="signupForm">
{% csrf_token %}

<div class="input-box">
    <i class="bi bi-person icon"></i>
    <input type="text" name="username" placeholder="Full Name">
</div>

<div class="input-box">
    <i class="bi bi-envelope icon"></i>
    <input type="email" name="email" placeholder="Email">
</div>

<div class="input-box">
    <i class="bi bi-lock icon"></i>
    <input type="password" id="password" name="password" placeholder="Password">

    <!-- ✅ only ONE eye icon -->
    <i class="bi bi-eye" id="togglePassword" style="cursor:pointer;"></i>
</div>

<p id="password-rules" class="rules">
• At least 6 characters  
<br>• 2 letters  
<br>• 2 numbers  
<br>• 1 special character
</p>

<div class="input-box">
    <i class="bi bi-lock-fill icon"></i>
    <input type="password" name="confirm_password" placeholder="Confirm Password">
</div>

<button type="submit">Sign Up</button>

</form>
<!-- 🔥 OTP MODAL -->
<div id="otpModal" class="otp-modal">

    <div class="otp-content">
        <h3>Enter OTP</h3>
        <p>Check your email for OTP</p>

        <div class="otp-inputs">
            <input maxlength="1">
            <input maxlength="1">
            <input maxlength="1">
            <input maxlength="1">
            <input maxlength="1">
            <input maxlength="1">
        </div>

        <button onclick="verifyOtp()">Verify OTP</button>
    </div>

</div>
</div>

</div>

<script>document.addEventListener("DOMContentLoaded", function () {

    // ===== PASSWORD RULES =====
    const passwordInput = document.getElementById("password");
    const rules = document.getElementById("password-rules");
    const toggle = document.getElementById("togglePassword");

    if (passwordInput && rules) {

        passwordInput.addEventListener("focus", () => {
            rules.classList.add("show");
        });

        passwordInput.addEventListener("input", () => {
            if (passwordInput.value.length > 0) {
                rules.classList.add("show");
            }
        });

        passwordInput.addEventListener("blur", () => {
            if (passwordInput.value === "") {
                rules.classList.remove("show");
            }
        });
    }

    // ===== TOGGLE PASSWORD =====
    if (toggle && passwordInput) {

        toggle.addEventListener("click", () => {

            toggle.style.transform = "scale(1.2)";
            setTimeout(() => toggle.style.transform = "scale(1)", 150);

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggle.classList.replace("bi-eye", "bi-eye-slash");
            } else {
                passwordInput.type = "password";
                toggle.classList.replace("bi-eye-slash", "bi-eye");
            }
        });
    }

    // ===== OTP + FORM =====
    const form = document.getElementById("signupForm");
    const modal = document.getElementById("otpModal");
    const otpInputs = document.querySelectorAll(".otp-inputs input");

    // 🔥 STOP FORM + SHOW OTP
    form.addEventListener("submit", function(e){

        e.preventDefault();

        const password = passwordInput.value;
        const confirm = document.querySelector('[name="confirm_password"]').value;

        if(password !== confirm){
            alert("Passwords do not match");
            return;
        }

        modal.style.display = "flex";
        otpInputs[0].focus(); // focus first box
    });

    // 🔥 AUTO MOVE + BACKSPACE
    otpInputs.forEach((input, index) => {

        input.addEventListener("input", () => {
            if (input.value.length === 1 && index < otpInputs.length - 1) {
                otpInputs[index + 1].focus();
            }
        });

        input.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" && input.value === "" && index > 0) {
                otpInputs[index - 1].focus();
            }
        });

    });

});


// ===== GLOBAL OTP FUNCTION =====
function verifyOtp(){

    const otpInputs = document.querySelectorAll(".otp-inputs input");
    let otp = "";

    otpInputs.forEach(i => otp += i.value);

    otp = otp.trim();

    if(otp === "123456"){   // ✅ DEMO OTP

        document.getElementById("signupForm").submit();

    } else {
        alert("Invalid OTP");
    }
}</script>

</body>
</html>
