{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>Create Project</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/CreateNew.css' %}">

</head>

<body>

<div class="container mt-5">

<h2 class="mb-4">Create New Project</h2>

<div class="form-card">

<form method="post" enctype="multipart/form-data">
{% csrf_token %}

<!-- TITLE -->
<div class="mb-3">
<label class="form-label">Project Title</label>
<input type="text" name="project_name" class="form-control" placeholder="Enter project name" required>
</div>

<!-- DESCRIPTION -->
<div class="mb-3">
<label class="form-label">
    Project Description <span class="optional">(Optional)</span>
</label>

<textarea name="project_description" class="form-control" rows="4"
placeholder="Describe your project..."></textarea>

<small class="helper-text">
    You can leave this empty and update later.
</small>
</div>

<!-- FILE -->
<div class="mb-3">
<label class="form-label">
    Upload File <span class="optional">(Optional)</span>
</label>

<div class="drop-area" onclick="document.getElementById('fileInput').click()">
    <p id="fileText">📂 Click to upload file</p>
    <input type="file" name="project_file" id="fileInput" hidden>
</div>

<small class="helper-text">
    You can skip this and upload later.
</small>
</div>

<!-- DATES -->
<div class="row">
    <div class="col-md-6 mb-3">
        <label class="form-label">Start Date</label>
        <input type="date" name="start_date" class="form-control" required>
    </div>

    <div class="col-md-6 mb-3">
        <label class="form-label">End Date</label>
        <input type="date" name="end_date" class="form-control" required>
    </div>
</div>

<!-- SUBMIT -->
<button type="submit" class="btn btn-create">Create Project</button>

</form>

</div>

</div>

<script src="{% static 'js/CreateNew.js' %}"></script>

</body>
</html>
